[package]
name = "loci-wasm-plugin-sdk"
version = "0.1.0"
edition = "2021"
authors = ["decade-afk"]
description = "SDK for building WASM plugins for Loci LLM inference framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/decade-afk/loci"

[lib]
name = "loci_wasm_plugin_sdk"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASI support for WASM plugins
wit-bindgen = "0.38"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization
strip = true         # Strip debug symbols
panic = "abort"      # Smaller binary size
