name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - refactor/new-architecture
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: windows
            os: windows-2022
            cmake_generator: Visual Studio 17 2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Initialize MSVC build environment
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Pin CMake generator (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=${{ matrix.cmake_generator }}"

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build build-essential pkg-config

      - name: Configure bindgen (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Configure bindgen (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $libclang = Get-ChildItem -Path @(
            'C:\Program Files\LLVM\bin\libclang.dll',
            'D:\Program Files\LLVM\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll'
          ) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libclang) {
            throw 'libclang.dll not found on the GitHub runner'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$($libclang.DirectoryName)"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test -q

      - name: Run loci-ffi tests
        run: cargo test -q -p loci-ffi

      - name: Run loci-core llama tests
        run: cargo test -q -p loci-core --features llama

      - name: Run loci-cli llama tests
        run: cargo test -q -p loci-cli --features llama

      - name: Run loci-ffi llama tests
        run: cargo test -q -p loci-ffi --features llama

      - name: Build loci-cli with llama
        run: cargo build -q -p loci-cli --release --features llama

      - name: Build loci-ffi with llama
        run: cargo build -q -p loci-ffi --release --features llama
