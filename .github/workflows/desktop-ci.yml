# Loci Desktop CI
# Phase 1桌面平台CI - Windows/Linux/macOS

name: Desktop CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========== Windows (CUDA) ==========
  windows-cuda:
    name: Windows (CUDA)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.6.0'  # 2025年推荐版本

      - name: Build with CUDA
        run: cargo build --release --target x86_64-pc-windows-gnu --features cuda

      - name: Run tests
        run: cargo test --release --target x86_64-pc-windows-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-windows-cuda
          path: |
            target/x86_64-pc-windows-gnu/release/loci.dll
            target/x86_64-pc-windows-gnu/release/loci.lib

  # ========== Linux (CPU/AVX512) ==========
  linux-avx512:
    name: Linux (AVX512)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang

      - name: Build with AVX512
        run: cargo build --release --features avx512

      - name: Run tests
        run: cargo test --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-linux-avx512
          path: target/release/libloci.so

  # ========== macOS (Metal) ==========
  macos-metal:
    name: macOS (Metal)
    runs-on: macos-14  # M系列Mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build with Metal
        run: cargo build --release --features metal

      - name: Run tests
        run: cargo test --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-macos-metal
          path: target/release/libloci.dylib

  # ========== loci-cli验证 ==========
  loci-cli-test:
    name: loci-cli验证
    runs-on: ubuntu-latest
    needs: [linux-avx512]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Build loci-cli
        run: cargo build --release --example loci-cli

      - name: Test Backend detection
        run: cargo run --release --example loci-cli -- --backend-info
