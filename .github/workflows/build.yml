name: Build and Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MSYS2 (for GNU target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build executable
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build libraries
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loci.exe dist/ || true
          cp target/${{ matrix.target }}/release/loci.dll dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp target/${{ matrix.target }}/release/loci.lib dist/ || true
          cp include/loci.h dist/
          cd dist
          7z a ../loci-windows-${{ matrix.target }}.zip *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-windows-${{ matrix.target }}
          path: loci-windows-${{ matrix.target }}.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build executable
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build libraries
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loci dist/ || true
          cp target/${{ matrix.target }}/release/libloci.so dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-linux-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-linux-${{ matrix.target }}
          path: loci-linux-${{ matrix.target }}.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build executable
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build libraries
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loci dist/ || true
          cp target/${{ matrix.target }}/release/libloci.dylib dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-macos-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-macos-${{ matrix.target }}
          path: loci-macos-${{ matrix.target }}.tar.gz

  # Temporarily disabled: wasmtime doesn't support iOS yet
  # Re-enable when wasmtime adds iOS support or we make WASM plugins optional
  build-ios:
    if: false
    name: Build iOS
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-ios
          - x86_64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Build library (iOS doesn't support executables)
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-ios-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-ios-${{ matrix.target }}
          path: loci-ios-${{ matrix.target }}.tar.gz

  # Temporarily disabled: wasmtime/cranelift doesn't support ARMv7 yet
  # Re-enable when wasmtime adds ARMv7 support or we make WASM plugins optional
  build-android:
    if: false
    name: Build Android
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

          # Set environment for all targets
          TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin

          # aarch64
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android21-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/llvm-ar" >> $GITHUB_ENV

          # armv7
          echo "CC_armv7_linux_androideabi=${TOOLCHAIN}/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CXX_armv7_linux_androideabi=${TOOLCHAIN}/armv7a-linux-androideabi21-clang++" >> $GITHUB_ENV
          echo "AR_armv7_linux_androideabi=${TOOLCHAIN}/llvm-ar" >> $GITHUB_ENV

          # x86_64
          echo "CC_x86_64_linux_android=${TOOLCHAIN}/x86_64-linux-android21-clang" >> $GITHUB_ENV
          echo "CXX_x86_64_linux_android=${TOOLCHAIN}/x86_64-linux-android21-clang++" >> $GITHUB_ENV
          echo "AR_x86_64_linux_android=${TOOLCHAIN}/llvm-ar" >> $GITHUB_ENV

          # i686
          echo "CC_i686_linux_android=${TOOLCHAIN}/i686-linux-android21-clang" >> $GITHUB_ENV
          echo "CXX_i686_linux_android=${TOOLCHAIN}/i686-linux-android21-clang++" >> $GITHUB_ENV
          echo "AR_i686_linux_android=${TOOLCHAIN}/llvm-ar" >> $GITHUB_ENV

      - name: Build library
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libloci.so dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-android-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-android-${{ matrix.target }}
          path: loci-android-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    # TODO: Add build-ios and build-android when wasmtime supports these platforms
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
