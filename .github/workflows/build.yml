name: Build and Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MSYS2 (for GNU target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          path-type: inherit
          location: D:\msys64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure bindgen (Windows)
        shell: pwsh
        run: |
          $libclang = Get-ChildItem -Path @(
            'C:\Program Files\LLVM\bin\libclang.dll',
            'D:\Program Files\LLVM\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll'
          ) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libclang) {
            throw 'libclang.dll not found on the GitHub runner'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$($libclang.DirectoryName)"

      - name: Configure Windows GNU toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $candidateBins = [System.Collections.Generic.List[string]]::new()
          foreach ($candidate in @(
            $(if ($env:MSYSTEM_PREFIX) { Join-Path $env:MSYSTEM_PREFIX 'bin' }),
            $(if ($env:MSYS2_LOCATION) { Join-Path $env:MSYS2_LOCATION 'mingw64/bin' })
          )) {
            if ($candidate -and (Test-Path (Join-Path $candidate 'gcc.exe'))) {
              $candidateBins.Add((Resolve-Path $candidate).Path)
            }
          }

          if ($candidateBins.Count -eq 0) {
            $gccCommand = @(
              (Get-Command x86_64-w64-mingw32-gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source,
              (Get-Command gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
            ) | Where-Object { $_ } | Select-Object -First 1
            if ($gccCommand) {
              $candidateBins.Add((Split-Path $gccCommand -Parent))
            }
          }

          $mingwBin = $candidateBins | Select-Object -First 1
          if (-not $mingwBin) {
            throw 'MinGW bin directory not found after MSYS2 setup'
          }

          $gcc = @(
            (Join-Path $mingwBin 'x86_64-w64-mingw32-gcc.exe'),
            (Join-Path $mingwBin 'gcc.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $gxx = @(
            (Join-Path $mingwBin 'x86_64-w64-mingw32-g++.exe'),
            (Join-Path $mingwBin 'g++.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $ar = @(
            (Join-Path $mingwBin 'x86_64-w64-mingw32-ar.exe'),
            (Join-Path $mingwBin 'ar.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $ranlib = @(
            (Join-Path $mingwBin 'x86_64-w64-mingw32-ranlib.exe'),
            (Join-Path $mingwBin 'ranlib.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          foreach ($tool in @($gcc, $gxx, $ar, $ranlib)) {
            if (-not $tool) {
              throw 'Required MinGW tool not found on PATH after MSYS2 setup'
            }
          }

          $mingwRoot = Split-Path $mingwBin -Parent
          $includeDirs = [System.Collections.Generic.List[string]]::new()

          foreach ($includeCandidate in @(
            (Join-Path $mingwRoot 'x86_64-w64-mingw32/include'),
            (Join-Path $mingwRoot 'include')
          )) {
            if (Test-Path $includeCandidate) {
              $includeDirs.Add((Resolve-Path $includeCandidate).Path)
            }
          }

          if ($includeDirs.Count -eq 0) {
            throw 'MinGW include directories not found on the GitHub runner'
          }

          $clangArgs = @('--target=x86_64-w64-windows-gnu')
          foreach ($dir in $includeDirs | Select-Object -Unique) {
            $clangArgs += "-I$dir"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$gxx"
          Add-Content -Path $env:GITHUB_ENV -Value "CC_x86_64_pc_windows_gnu=$gcc"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX_x86_64_pc_windows_gnu=$gxx"
          Add-Content -Path $env:GITHUB_ENV -Value "AR_x86_64_pc_windows_gnu=$ar"
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_SYSTEM_NAME=Windows"
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_SYSTEM_PROCESSOR=x86_64"
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_C_COMPILER=$gcc"
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_CXX_COMPILER=$gxx"
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_AR=$ar"
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_RANLIB=$ranlib"
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Ninja"
          Add-Content -Path $env:GITHUB_ENV -Value "BINDGEN_EXTRA_CLANG_ARGS=$($clangArgs -join ' ')"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            cargo build --locked --release --target ${{ matrix.target }} --no-default-features --features auto-detect
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Build libraries
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            cargo build --locked --release --lib --target ${{ matrix.target }} --no-default-features --features auto-detect
          else
            cargo build --locked --release --lib --target ${{ matrix.target }}
          fi

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loci.exe dist/ || true
          cp target/${{ matrix.target }}/release/loci.dll dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp target/${{ matrix.target }}/release/loci.lib dist/ || true
          cp include/loci.h dist/
          cd dist
          7z a ../loci-windows-${{ matrix.target }}.zip *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-windows-${{ matrix.target }}
          path: loci-windows-${{ matrix.target }}.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build

      - name: Configure bindgen
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Configure Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          GCC=$(command -v aarch64-linux-gnu-gcc)
          GXX=$(command -v aarch64-linux-gnu-g++)
          AR=$(command -v aarch64-linux-gnu-ar)
          RANLIB=$(command -v aarch64-linux-gnu-ranlib)

          test -n "$GCC"
          test -n "$GXX"
          test -n "$AR"
          test -n "$RANLIB"

          SYSROOT=$(aarch64-linux-gnu-gcc -print-sysroot)
          TARGET_INCLUDE_DIR=/usr/aarch64-linux-gnu/include
          GCC_INCLUDE_DIR=$("$GCC" -print-file-name=include)
          CLANG_ARGS=(--target=aarch64-linux-gnu)
          CFLAGS=()

          if [ -n "$SYSROOT" ] && [ "$SYSROOT" != "/" ] && [ -d "$SYSROOT" ]; then
            CLANG_ARGS+=(--sysroot="$SYSROOT")
            CFLAGS+=(--sysroot="$SYSROOT")
          fi

          if [ -d "$TARGET_INCLUDE_DIR" ]; then
            CLANG_ARGS+=("-I$TARGET_INCLUDE_DIR")
            CFLAGS+=("-I$TARGET_INCLUDE_DIR")
          fi

          if [ -n "$GCC_INCLUDE_DIR" ] && [ -d "$GCC_INCLUDE_DIR" ]; then
            CLANG_ARGS+=("-I$GCC_INCLUDE_DIR")
            CFLAGS+=("-I$GCC_INCLUDE_DIR")
          fi

          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$GXX" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=$GCC" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=$GXX" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=$AR" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=$SYSROOT" >> $GITHUB_ENV
          echo "LOCI_CMAKE_BUILD_JOBS=2" >> $GITHUB_ENV
          echo "CMAKE_SYSTEM_NAME=Linux" >> $GITHUB_ENV
          echo "CMAKE_SYSTEM_PROCESSOR=aarch64" >> $GITHUB_ENV
          echo "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER=$GCC" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=$GXX" >> $GITHUB_ENV
          echo "CMAKE_AR=$AR" >> $GITHUB_ENV
          echo "CMAKE_RANLIB=$RANLIB" >> $GITHUB_ENV
          echo "CFLAGS_aarch64_unknown_linux_gnu=${CFLAGS[*]}" >> $GITHUB_ENV
          echo "CXXFLAGS_aarch64_unknown_linux_gnu=${CFLAGS[*]}" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=${CLANG_ARGS[*]}" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo build --locked --release --target ${{ matrix.target }} --no-default-features --features auto-detect
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Build libraries
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo build --locked --release --lib --target ${{ matrix.target }} --no-default-features --features auto-detect
          else
            cargo build --locked --release --lib --target ${{ matrix.target }}
          fi

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loci dist/ || true
          cp target/${{ matrix.target }}/release/libloci.so dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-linux-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-linux-${{ matrix.target }}
          path: loci-linux-${{ matrix.target }}.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure Apple desktop toolchain
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              ARCH=arm64
              LINKER_VAR=CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER
              CC_VAR=CC_aarch64_apple_darwin
              CXX_VAR=CXX_aarch64_apple_darwin
              AR_VAR=AR_aarch64_apple_darwin
              CFLAGS_VAR=CFLAGS_aarch64_apple_darwin
              CXXFLAGS_VAR=CXXFLAGS_aarch64_apple_darwin
              ;;
            x86_64-apple-darwin)
              ARCH=x86_64
              LINKER_VAR=CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER
              CC_VAR=CC_x86_64_apple_darwin
              CXX_VAR=CXX_x86_64_apple_darwin
              AR_VAR=AR_x86_64_apple_darwin
              CFLAGS_VAR=CFLAGS_x86_64_apple_darwin
              CXXFLAGS_VAR=CXXFLAGS_x86_64_apple_darwin
              ;;
          esac

          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          CLANG=$(xcrun --sdk macosx --find clang)
          CLANGXX=$(xcrun --sdk macosx --find clang++)
          AR=$(xcrun --sdk macosx --find ar)
          DEPLOYMENT_TARGET=12.0
          CFLAGS="-arch $ARCH -isysroot $SDKROOT -mmacosx-version-min=$DEPLOYMENT_TARGET"

          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> $GITHUB_ENV
          echo "CMAKE_OSX_SYSROOT=$SDKROOT" >> $GITHUB_ENV
          echo "CMAKE_OSX_ARCHITECTURES=$ARCH" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> $GITHUB_ENV
          echo "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER=$CLANG" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=$CLANGXX" >> $GITHUB_ENV
          echo "CMAKE_AR=$AR" >> $GITHUB_ENV
          echo "CMAKE_C_FLAGS=$CFLAGS" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=$CFLAGS" >> $GITHUB_ENV
          echo "$LINKER_VAR=$CLANG" >> $GITHUB_ENV
          echo "$CC_VAR=$CLANG" >> $GITHUB_ENV
          echo "$CXX_VAR=$CLANGXX" >> $GITHUB_ENV
          echo "$AR_VAR=$AR" >> $GITHUB_ENV
          echo "$CFLAGS_VAR=$CFLAGS" >> $GITHUB_ENV
          echo "$CXXFLAGS_VAR=$CFLAGS" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-arch $ARCH -isysroot $SDKROOT -mmacosx-version-min=$DEPLOYMENT_TARGET" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build executable
        run: cargo build --locked --release --target ${{ matrix.target }} --no-default-features --features auto-detect

      - name: Build libraries
        run: cargo build --locked --release --lib --target ${{ matrix.target }} --no-default-features --features auto-detect

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loci dist/ || true
          cp target/${{ matrix.target }}/release/libloci.dylib dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-macos-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-macos-${{ matrix.target }}
          path: loci-macos-${{ matrix.target }}.tar.gz

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - x86_64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure Apple mobile toolchain
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-ios)
              SDK=iphoneos
              ARCH=arm64
              LINKER_VAR=CARGO_TARGET_AARCH64_APPLE_IOS_LINKER
              CC_VAR=CC_aarch64_apple_ios
              CXX_VAR=CXX_aarch64_apple_ios
              AR_VAR=AR_aarch64_apple_ios
              CFLAGS_VAR=CFLAGS_aarch64_apple_ios
              CXXFLAGS_VAR=CXXFLAGS_aarch64_apple_ios
              DEPLOYMENT_FLAG=-miphoneos-version-min=13.0
              ;;
            aarch64-apple-ios-sim)
              SDK=iphonesimulator
              ARCH=arm64
              LINKER_VAR=CARGO_TARGET_AARCH64_APPLE_IOS_SIM_LINKER
              CC_VAR=CC_aarch64_apple_ios_sim
              CXX_VAR=CXX_aarch64_apple_ios_sim
              AR_VAR=AR_aarch64_apple_ios_sim
              CFLAGS_VAR=CFLAGS_aarch64_apple_ios_sim
              CXXFLAGS_VAR=CXXFLAGS_aarch64_apple_ios_sim
              DEPLOYMENT_FLAG=-mios-simulator-version-min=13.0
              ;;
            x86_64-apple-ios)
              SDK=iphonesimulator
              ARCH=x86_64
              LINKER_VAR=CARGO_TARGET_X86_64_APPLE_IOS_LINKER
              CC_VAR=CC_x86_64_apple_ios
              CXX_VAR=CXX_x86_64_apple_ios
              AR_VAR=AR_x86_64_apple_ios
              CFLAGS_VAR=CFLAGS_x86_64_apple_ios
              CXXFLAGS_VAR=CXXFLAGS_x86_64_apple_ios
              DEPLOYMENT_FLAG=-mios-simulator-version-min=13.0
              ;;
          esac

          SDKROOT=$(xcrun --sdk "$SDK" --show-sdk-path)
          CLANG=$(xcrun --sdk "$SDK" --find clang)
          CLANGXX=$(xcrun --sdk "$SDK" --find clang++)
          AR=$(xcrun --sdk "$SDK" --find ar)
          CFLAGS="$DEPLOYMENT_FLAG -arch $ARCH -isysroot $SDKROOT"

          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          echo "CMAKE_SYSTEM_NAME=iOS" >> $GITHUB_ENV
          echo "CMAKE_SYSTEM_PROCESSOR=$ARCH" >> $GITHUB_ENV
          echo "CMAKE_OSX_SYSROOT=$SDKROOT" >> $GITHUB_ENV
          echo "CMAKE_OSX_ARCHITECTURES=$ARCH" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV
          echo "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY" >> $GITHUB_ENV
          echo "IPHONEOS_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER=$CLANG" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=$CLANGXX" >> $GITHUB_ENV
          echo "CMAKE_AR=$AR" >> $GITHUB_ENV
          echo "CMAKE_C_FLAGS=$CFLAGS" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=$CFLAGS" >> $GITHUB_ENV
          echo "$LINKER_VAR=$CLANG" >> $GITHUB_ENV
          echo "$CC_VAR=$CLANG" >> $GITHUB_ENV
          echo "$CXX_VAR=$CLANGXX" >> $GITHUB_ENV
          echo "$AR_VAR=$AR" >> $GITHUB_ENV
          echo "$CFLAGS_VAR=$CFLAGS" >> $GITHUB_ENV
          echo "$CXXFLAGS_VAR=$CFLAGS" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-arch $ARCH -isysroot $SDKROOT $DEPLOYMENT_FLAG" >> $GITHUB_ENV

      - name: Build library (iOS doesn't support executables)
        run: cargo rustc --locked --release --lib --target ${{ matrix.target }} --no-default-features --features auto-detect -- --crate-type staticlib

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-ios-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-ios-${{ matrix.target }}
          path: loci-ios-${{ matrix.target }}.tar.gz

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build

      - name: Configure bindgen
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Configure Android toolchain
        shell: bash
        run: |
          TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          SYSROOT=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot

          case "${{ matrix.target }}" in
            aarch64-linux-android)
              ABI=arm64-v8a
              API=24
              CLANG_TRIPLE=aarch64-linux-android
              ARCH=arm64
              LINKER_VAR=CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
              CC_VAR=CC_aarch64_linux_android
              CXX_VAR=CXX_aarch64_linux_android
              AR_VAR=AR_aarch64_linux_android
              CFLAGS_VAR=CFLAGS_aarch64_linux_android
              CXXFLAGS_VAR=CXXFLAGS_aarch64_linux_android
              ;;
            armv7-linux-androideabi)
              ABI=armeabi-v7a
              API=24
              CLANG_TRIPLE=armv7a-linux-androideabi
              ARCH=armv7-a
              LINKER_VAR=CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
              CC_VAR=CC_armv7_linux_androideabi
              CXX_VAR=CXX_armv7_linux_androideabi
              AR_VAR=AR_armv7_linux_androideabi
              CFLAGS_VAR=CFLAGS_armv7_linux_androideabi
              CXXFLAGS_VAR=CXXFLAGS_armv7_linux_androideabi
              ;;
            x86_64-linux-android)
              ABI=x86_64
              API=24
              CLANG_TRIPLE=x86_64-linux-android
              ARCH=x86_64
              LINKER_VAR=CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
              CC_VAR=CC_x86_64_linux_android
              CXX_VAR=CXX_x86_64_linux_android
              AR_VAR=AR_x86_64_linux_android
              CFLAGS_VAR=CFLAGS_x86_64_linux_android
              CXXFLAGS_VAR=CXXFLAGS_x86_64_linux_android
              ;;
            i686-linux-android)
              ABI=x86
              API=24
              CLANG_TRIPLE=i686-linux-android
              ARCH=x86
              LINKER_VAR=CARGO_TARGET_I686_LINUX_ANDROID_LINKER
              CC_VAR=CC_i686_linux_android
              CXX_VAR=CXX_i686_linux_android
              AR_VAR=AR_i686_linux_android
              CFLAGS_VAR=CFLAGS_i686_linux_android
              CXXFLAGS_VAR=CXXFLAGS_i686_linux_android
              ;;
          esac

          CLANG="$TOOLCHAIN/${CLANG_TRIPLE}${API}-clang"
          CLANGXX="$TOOLCHAIN/${CLANG_TRIPLE}${API}-clang++"
          AR="$TOOLCHAIN/llvm-ar"
          RANLIB="$TOOLCHAIN/llvm-ranlib"
          CFLAGS="--sysroot=$SYSROOT -fPIC"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
          echo "CMAKE_SYSTEM_NAME=Android" >> $GITHUB_ENV
          echo "CMAKE_SYSTEM_PROCESSOR=$ARCH" >> $GITHUB_ENV
          echo "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY" >> $GITHUB_ENV
          echo "ANDROID_ABI=$ABI" >> $GITHUB_ENV
          echo "ANDROID_PLATFORM=android-$API" >> $GITHUB_ENV
          echo "ANDROID_STL=c++_shared" >> $GITHUB_ENV
          echo "CMAKE_ANDROID_STL_TYPE=c++_shared" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER=$CLANG" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=$CLANGXX" >> $GITHUB_ENV
          echo "CMAKE_AR=$AR" >> $GITHUB_ENV
          echo "CMAKE_RANLIB=$RANLIB" >> $GITHUB_ENV
          echo "CMAKE_C_FLAGS=$CFLAGS" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=$CFLAGS" >> $GITHUB_ENV
          echo "$LINKER_VAR=$CLANG" >> $GITHUB_ENV
          echo "$CC_VAR=$CLANG" >> $GITHUB_ENV
          echo "$CXX_VAR=$CLANGXX" >> $GITHUB_ENV
          echo "$AR_VAR=$AR" >> $GITHUB_ENV
          echo "$CFLAGS_VAR=$CFLAGS" >> $GITHUB_ENV
          echo "$CXXFLAGS_VAR=$CFLAGS" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=${CLANG_TRIPLE}${API} --sysroot=$SYSROOT" >> $GITHUB_ENV

      - name: Build library
        shell: bash
        run: |
          cargo rustc --locked --release --lib --target ${{ matrix.target }} --no-default-features --features auto-detect -- --crate-type cdylib
          cargo rustc --locked --release --lib --target ${{ matrix.target }} --no-default-features --features auto-detect -- --crate-type staticlib

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libloci.so dist/ || true
          cp target/${{ matrix.target }}/release/libloci.a dist/ || true
          cp include/loci.h dist/
          cd dist
          tar czf ../loci-android-${{ matrix.target }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loci-android-${{ matrix.target }}
          path: loci-android-${{ matrix.target }}.tar.gz

  build-android-sdk:
    name: Build Android SDK
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: loci-android-aarch64-linux-android
          path: android-native-artifacts/aarch64-linux-android

      - name: Download Android armv7 artifact
        uses: actions/download-artifact@v4
        with:
          name: loci-android-armv7-linux-androideabi
          path: android-native-artifacts/armv7-linux-androideabi

      - name: Download Android x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: loci-android-x86_64-linux-android
          path: android-native-artifacts/x86_64-linux-android

      - name: Download Android x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: loci-android-i686-linux-android
          path: android-native-artifacts/i686-linux-android

      - name: Extract Android native libraries
        shell: bash
        run: |
          declare -A ABI_MAP=(
            [aarch64-linux-android]=arm64-v8a
            [armv7-linux-androideabi]=armeabi-v7a
            [x86_64-linux-android]=x86_64
            [i686-linux-android]=x86
          )

          for target in "${!ABI_MAP[@]}"; do
            archive="android-native-artifacts/${target}/loci-android-${target}.tar.gz"
            abi="${ABI_MAP[$target]}"
            test -f "$archive"
            mkdir -p "android-sdk/loci-sdk/src/main/jniLibs/$abi"
            tmpdir="$(mktemp -d)"
            tar xzf "$archive" -C "$tmpdir"
            cp "$tmpdir/libloci.so" "android-sdk/loci-sdk/src/main/jniLibs/$abi/libloci.so"
            rm -rf "$tmpdir"
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -n "$SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"
          printf "sdk.dir=%s\n" "$SDK_ROOT" > android-sdk/local.properties

      - name: Assemble Android SDK
        env:
          LOCI_ANDROID_SDK_VERSION: 0.1.0-dev.${{ github.run_number }}
        run: gradle --no-daemon --stacktrace -p android-sdk :loci-sdk:assembleRelease :sample-app:assembleDebug

      - name: Upload Android SDK AAR
        uses: actions/upload-artifact@v4
        with:
          name: loci-android-sdk-aar
          path: android-sdk/loci-sdk/build/outputs/aar/loci-sdk-release.aar

      - name: Upload Android sample APK
        uses: actions/upload-artifact@v4
        with:
          name: loci-android-sample-apk
          path: android-sdk/sample-app/build/outputs/apk/debug/sample-app-debug.apk

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos, build-ios, build-android, build-android-sdk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
