name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build

      - name: Configure bindgen (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      - name: Configure bindgen (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $libclang = Get-ChildItem -Path @(
            'C:\Program Files\LLVM\bin\libclang.dll',
            'D:\Program Files\LLVM\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
            'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
            'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll'
          ) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libclang) {
            throw 'libclang.dll not found on the GitHub runner'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$($libclang.DirectoryName)"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked --release

      - name: Build CLI
        run: cargo build --locked --release

      - name: Build libraries
        run: cargo build --locked --release --lib

  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build

      - name: Configure bindgen
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Run clippy
        continue-on-error: true
        run: cargo clippy --all-targets --features redis-store -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  android-sdk-smoke:
    name: Android SDK Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build unzip

      - name: Configure bindgen
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -n "$SDK_ROOT"
          set +o pipefail
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null
          license_status=$?
          set -o pipefail
          test "$license_status" -eq 0
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\n" "$SDK_ROOT" > android-sdk/local.properties

      - name: Configure Android Rust toolchain
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="$SDK_ROOT/ndk/27.3.13750724"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
          CLANGXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          AR="$TOOLCHAIN/llvm-ar"
          RANLIB="$TOOLCHAIN/llvm-ranlib"
          CFLAGS="--sysroot=$SYSROOT -fPIC"

          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake" >> "$GITHUB_ENV"
          echo "CMAKE_SYSTEM_NAME=Android" >> "$GITHUB_ENV"
          echo "CMAKE_SYSTEM_PROCESSOR=arm64" >> "$GITHUB_ENV"
          echo "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY" >> "$GITHUB_ENV"
          echo "ANDROID_ABI=arm64-v8a" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=android-24" >> "$GITHUB_ENV"
          echo "ANDROID_STL=c++_shared" >> "$GITHUB_ENV"
          echo "CMAKE_ANDROID_STL_TYPE=c++_shared" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER=$CLANG" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=$CLANGXX" >> "$GITHUB_ENV"
          echo "CMAKE_AR=$AR" >> "$GITHUB_ENV"
          echo "CMAKE_RANLIB=$RANLIB" >> "$GITHUB_ENV"
          echo "CMAKE_C_FLAGS=$CFLAGS" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_FLAGS=$CFLAGS" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$CLANGXX" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$AR" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64_linux_android=$CFLAGS" >> "$GITHUB_ENV"
          echo "CXXFLAGS_aarch64_linux_android=$CFLAGS" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android24 --sysroot=$SYSROOT" >> "$GITHUB_ENV"

      - name: Build Android native library
        run: cargo rustc --locked --release --lib --target aarch64-linux-android --no-default-features --features auto-detect -- --crate-type cdylib

      - name: Sync native Android libraries
        run: bash android-sdk/scripts/sync-prebuilt-loci.sh

      - name: Assemble Android SDK and sample app
        run: gradle --no-daemon --stacktrace -p android-sdk :loci-sdk:assembleRelease :sample-app:assembleDebug
