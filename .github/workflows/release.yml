name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: loci
            asset_name: loci-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: loci.exe
            asset_name: loci-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: loci
            asset_name: loci-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: loci
            asset_name: loci-macos-aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install CMake (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev llvm-dev cmake build-essential

    - name: Configure bindgen (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

    - name: Install CMake (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install cmake

    - name: Configure bindgen (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $libclang = Get-ChildItem -Path @(
          'C:\Program Files\LLVM\bin\libclang.dll',
          'D:\Program Files\LLVM\bin\libclang.dll',
          'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
          'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
          'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
          'C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
          'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
          'D:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll',
          'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\bin\libclang.dll',
          'D:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\Llvm\*\bin\libclang.dll'
        ) -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $libclang) {
          throw 'libclang.dll not found on the GitHub runner'
        }
        Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$($libclang.DirectoryName)"

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Strip binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        tag: ${{ github.ref }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev llvm-dev cmake build-essential

    - name: Configure bindgen
      run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

    - name: Publish to crates.io
      run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
      continue-on-error: true
