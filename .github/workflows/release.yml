name: Release Loci

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送 v0.1.0 这样的标签
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Loci ${{ steps.get_version.outputs.version }}
          body: |
            ## Loci AI Engine ${{ steps.get_version.outputs.version }}

            ### 📦 预编译库下载

            请根据你的平台下载对应的库文件：

            - **Windows (MinGW)**: `loci-windows-gnu.zip`
            - **Windows (MSVC)**: `loci-windows-msvc.zip`
            - **Linux**: `loci-linux.tar.gz`
            - **macOS**: `loci-macos.tar.gz`

            ### 📝 使用方法

            #### Rust 项目集成
            ```toml
            # Cargo.toml
            [dependencies]
            loci = { git = "https://github.com/你的用户名/loci", tag = "${{ steps.get_version.outputs.version }}" }
            ```

            #### C/C++ 项目集成
            1. 下载对应平台的 zip/tar.gz
            2. 解压得到 `loci.dll`/`libloci.so`/`libloci.dylib` 和 `loci.h`
            3. 在项目中链接库文件

            ### 🔧 编译信息

            - **Rust 版本**: 1.92.0
            - **llama-cpp 版本**: 0.1.130
            - **优化级别**: Release (opt-level=3, LTO enabled)

            ### 📖 文档

            完整文档: https://github.com/你的用户名/loci/blob/main/README.md
          draft: false
          prerelease: false

  build-windows-gnu:
    name: Build Windows (MinGW)
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1"
          directory: ${{ runner.temp }}/llvm

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=${{ runner.temp }}/llvm/bin" >> $GITHUB_ENV
        shell: bash

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu

      - name: Install MinGW
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH
        shell: bash

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package artifacts
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-gnu/release/loci.dll release/
          cp target/x86_64-pc-windows-gnu/release/libloci.a release/
          cp loci.h release/ 2>/dev/null || echo "loci.h not found"
          cd release
          7z a loci-windows-gnu.zip *
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/loci-windows-gnu.zip
          asset_name: loci-windows-gnu.zip
          asset_content_type: application/zip

  build-windows-msvc:
    name: Build Windows (MSVC)
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1"
          directory: ${{ runner.temp }}/llvm

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=${{ runner.temp }}/llvm/bin" >> $GITHUB_ENV
        shell: bash

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package artifacts
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-msvc/release/loci.dll release/
          cp target/x86_64-pc-windows-msvc/release/loci.lib release/ 2>/dev/null || echo "loci.lib not found"
          cp loci.h release/ 2>/dev/null || echo "loci.h not found"
          cd release
          7z a loci-windows-msvc.zip *
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/loci-windows-msvc.zip
          asset_name: loci-windows-msvc.zip
          asset_content_type: application/zip

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Release
        run: cargo build --release

      - name: Package artifacts
        run: |
          mkdir -p release
          cp target/release/libloci.so release/
          cp target/release/libloci.a release/
          cp loci.h release/ 2>/dev/null || echo "loci.h not found"
          cd release
          tar -czf loci-linux.tar.gz *

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/loci-linux.tar.gz
          asset_name: loci-linux.tar.gz
          asset_content_type: application/gzip

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Release
        run: cargo build --release

      - name: Package artifacts
        run: |
          mkdir -p release
          cp target/release/libloci.dylib release/
          cp target/release/libloci.a release/
          cp loci.h release/ 2>/dev/null || echo "loci.h not found"
          cd release
          tar -czf loci-macos.tar.gz *

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/loci-macos.tar.gz
          asset_name: loci-macos.tar.gz
          asset_content_type: application/gzip
