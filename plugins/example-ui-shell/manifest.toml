name = "example-ui-shell"
version = "0.1.0"
api_version = "1.0"
target_tracks = ["ai_infra", "ai_agent"]

[contributes]
commands = ["ui:open-dashboard", "ui:open-model-catalog"]

[contributes.ui_contributes]
panels = ["workspace-overview", "model-catalog"]
windows = ["operations-console"]
widgets = ["runtime-status"]

[core_rewriters]
ui_host = true

[runtime]
library_path = "runtime/plugin.dll"

[runtime.host_contract]
protocol = "loci.host-runtime.v1"
entrypoint = "loci_ui_host_bootstrap_v1"
capabilities = ["ui_host", "surface_registry"]
