name = "example-inference"
version = "0.1.0"
api_version = "1.0"
target_tracks = ["ai_infra"]

[contributes]
inference_hooks = ["sampling-profile"]
commands = ["inference:activate"]

[core_rewriters]
inference = true

[runtime]
sampling_profile = "sampling-hook.toml"

[bootstrap]
activate_on_load = ["inference"]
