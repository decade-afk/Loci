openapi: 3.0.3
info:
  title: Loci REST API
  version: "0.1.0"
  description: |
    Core REST and discovery endpoints exposed by `loci serve`.
    Prompt safety limit is configured at process startup via CLI/env:
    `--max-prompt-bytes` (minimum 1024) or `LOCI_MAX_PROMPT_BYTES`.
    If both are set, the CLI value takes priority.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/health:
    get:
      summary: Health check (versioned path)
      operationId: healthV1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /info:
    get:
      summary: Runtime model information and integration discovery
      operationId: info
      responses:
        "200":
          description: Model information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
  /v1/info:
    get:
      summary: Runtime model information and integration discovery (versioned path)
      operationId: infoV1
      responses:
        "200":
          description: Model information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
  /metrics:
    get:
      summary: Runtime request metrics
      operationId: metrics
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /v1/metrics:
    get:
      summary: Runtime request metrics (versioned path)
      operationId: metricsV1
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /events:
    get:
      summary: Read recent runtime control-plane events
      operationId: listRuntimeEvents
      parameters:
        - name: limit
          in: query
          required: false
          description: Return at most the most recent N events.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: Recent runtime events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeEventListResponse"
  /v1/events:
    get:
      summary: Read recent runtime control-plane events (versioned path)
      operationId: listRuntimeEventsV1
      parameters:
        - name: limit
          in: query
          required: false
          description: Return at most the most recent N events.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: Recent runtime events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeEventListResponse"
  /events/stream:
    get:
      summary: Stream runtime control-plane events as NDJSON
      operationId: streamRuntimeEvents
      parameters:
        - name: replay
          in: query
          required: false
          description: Replay at most the most recent N events before following the live stream.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: follow
          in: query
          required: false
          description: Keep the HTTP connection open and continue streaming new events.
          schema:
            type: boolean
      responses:
        "200":
          description: NDJSON stream of runtime events
          content:
            application/x-ndjson:
              description: Each line is a JSON object matching `RuntimeEvent`.
              schema:
                $ref: "#/components/schemas/RuntimeEvent"
  /v1/events/stream:
    get:
      summary: Stream runtime control-plane events as NDJSON (versioned path)
      operationId: streamRuntimeEventsV1
      parameters:
        - name: replay
          in: query
          required: false
          description: Replay at most the most recent N events before following the live stream.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: follow
          in: query
          required: false
          description: Keep the HTTP connection open and continue streaming new events.
          schema:
            type: boolean
      responses:
        "200":
          description: NDJSON stream of runtime events
          content:
            application/x-ndjson:
              description: Each line is a JSON object matching `RuntimeEvent`.
              schema:
                $ref: "#/components/schemas/RuntimeEvent"
  /openapi.yaml:
    get:
      summary: Embedded OpenAPI specification
      operationId: openapiSpec
      responses:
        "200":
          description: YAML OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /v1/openapi.yaml:
    get:
      summary: Embedded OpenAPI specification (versioned path)
      operationId: openapiSpecV1
      responses:
        "200":
          description: YAML OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      summary: Embedded OpenAPI specification in JSON form
      operationId: openapiSpecJson
      responses:
        "200":
          description: JSON OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/openapi.json:
    get:
      summary: Embedded OpenAPI specification in JSON form (versioned path)
      operationId: openapiSpecJsonV1
      responses:
        "200":
          description: JSON OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /models/plan:
    post:
      summary: Inspect model placement and memory plan without loading the runtime model
      operationId: modelPlan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelPlanRequest"
      responses:
        "200":
          description: Placement plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePlanReport"
        "400":
          description: Invalid request or model reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Control-plane auth rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: Internal planning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/plan:
    post:
      summary: Inspect model placement and memory plan (versioned path)
      operationId: modelPlanV1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelPlanRequest"
      responses:
        "200":
          description: Placement plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePlanReport"
        "400":
          description: Invalid request or model reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Control-plane auth rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: Internal planning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models/assets:
    get:
      summary: List registered model assets
      operationId: listModelAssets
      responses:
        "200":
          description: Model asset inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAssetListResponse"
    post:
      summary: Register an existing local model file without copying it
      operationId: addModelAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelAssetRegisterRequest"
      responses:
        "200":
          description: Registered model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredModel"
        "400":
          description: Invalid register request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/assets:
    get:
      summary: List registered model assets (versioned path)
      operationId: listModelAssetsV1
      responses:
        "200":
          description: Model asset inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAssetListResponse"
    post:
      summary: Register an existing local model file without copying it (versioned path)
      operationId: addModelAssetV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelAssetRegisterRequest"
      responses:
        "200":
          description: Registered model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredModel"
        "400":
          description: Invalid register request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models/assets/pull:
    post:
      summary: Import or download a model into the managed store
      operationId: pullModelAsset
      parameters:
        - name: stream
          in: query
          required: false
          description: Return progress as NDJSON events instead of a single JSON response.
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelAssetPullRequest"
      responses:
        "200":
          description: Imported model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredModel"
            application/x-ndjson:
              description: Each line is a JSON object matching `ModelAssetPullStreamEvent`.
              schema:
                $ref: "#/components/schemas/ModelAssetPullStreamEvent"
        "400":
          description: Invalid pull request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/assets/pull:
    post:
      summary: Import or download a model into the managed store (versioned path)
      operationId: pullModelAssetV1
      parameters:
        - name: stream
          in: query
          required: false
          description: Return progress as NDJSON events instead of a single JSON response.
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelAssetPullRequest"
      responses:
        "200":
          description: Imported model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredModel"
            application/x-ndjson:
              description: Each line is a JSON object matching `ModelAssetPullStreamEvent`.
              schema:
                $ref: "#/components/schemas/ModelAssetPullStreamEvent"
        "400":
          description: Invalid pull request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models/assets/pulls:
    get:
      summary: List background model pull jobs
      operationId: listModelPullJobs
      responses:
        "200":
          description: Model pull jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobListResponse"
    post:
      summary: Start a background model pull job
      operationId: createModelPullJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelAssetPullRequest"
      responses:
        "202":
          description: Background model pull job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobSnapshot"
        "400":
          description: Invalid pull job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/assets/pulls:
    get:
      summary: List background model pull jobs (versioned path)
      operationId: listModelPullJobsV1
      responses:
        "200":
          description: Model pull jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobListResponse"
    post:
      summary: Start a background model pull job (versioned path)
      operationId: createModelPullJobV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelAssetPullRequest"
      responses:
        "202":
          description: Background model pull job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobSnapshot"
        "400":
          description: Invalid pull job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models/assets/pulls/{job_id}:
    get:
      summary: Get one background model pull job
      operationId: getModelPullJob
      parameters:
        - $ref: "#/components/parameters/ModelPullJobId"
      responses:
        "200":
          description: Model pull job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobSnapshot"
        "404":
          description: Model pull job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/assets/pulls/{job_id}:
    get:
      summary: Get one background model pull job (versioned path)
      operationId: getModelPullJobV1
      parameters:
        - $ref: "#/components/parameters/ModelPullJobId"
      responses:
        "200":
          description: Model pull job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobSnapshot"
        "404":
          description: Model pull job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models/assets/pulls/{job_id}/cancel:
    post:
      summary: Request cancellation for one background model pull job
      operationId: cancelModelPullJob
      parameters:
        - $ref: "#/components/parameters/ModelPullJobId"
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobSnapshot"
        "404":
          description: Model pull job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Model pull job already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/assets/pulls/{job_id}/cancel:
    post:
      summary: Request cancellation for one background model pull job (versioned path)
      operationId: cancelModelPullJobV1
      parameters:
        - $ref: "#/components/parameters/ModelPullJobId"
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPullJobSnapshot"
        "404":
          description: Model pull job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Model pull job already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models/assets/pulls/{job_id}/events:
    get:
      summary: Subscribe to one background model pull job as NDJSON
      operationId: streamModelPullJobEvents
      parameters:
        - $ref: "#/components/parameters/ModelPullJobId"
      responses:
        "200":
          description: Each line is a JSON object matching `ModelPullJobEvent`.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ModelPullJobEvent"
        "404":
          description: Model pull job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/assets/pulls/{job_id}/events:
    get:
      summary: Subscribe to one background model pull job as NDJSON (versioned path)
      operationId: streamModelPullJobEventsV1
      parameters:
        - $ref: "#/components/parameters/ModelPullJobId"
      responses:
        "200":
          description: Each line is a JSON object matching `ModelPullJobEvent`.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ModelPullJobEvent"
        "404":
          description: Model pull job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models/assets/{id}:
    get:
      summary: Get one model asset by id
      operationId: getModelAsset
      parameters:
        - $ref: "#/components/parameters/ModelAssetId"
      responses:
        "200":
          description: Model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredModel"
        "404":
          description: Model asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Remove one model asset record
      operationId: removeModelAsset
      parameters:
        - $ref: "#/components/parameters/ModelAssetId"
        - name: delete_file
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Removed model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAssetRemoveResponse"
        "404":
          description: Model asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/assets/{id}:
    get:
      summary: Get one model asset by id (versioned path)
      operationId: getModelAssetV1
      parameters:
        - $ref: "#/components/parameters/ModelAssetId"
      responses:
        "200":
          description: Model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredModel"
        "404":
          description: Model asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Remove one model asset record (versioned path)
      operationId: removeModelAssetV1
      parameters:
        - $ref: "#/components/parameters/ModelAssetId"
        - name: delete_file
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Removed model asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAssetRemoveResponse"
        "404":
          description: Model asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate:
    post:
      summary: Generate text
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal inference error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/generate:
    post:
      summary: Generate text (versioned path)
      operationId: generateV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal inference error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models:
    get:
      summary: OpenAI-compatible model listing
      operationId: openAiModels
      responses:
        "200":
          description: Compatibility model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiModelListResponse"
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completions
      operationId: openAiChatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAiChatCompletionsRequest"
      responses:
        "200":
          description: Compatibility chat response or stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiChatCompletionsResponse"
            text/event-stream:
              schema:
                type: string
  /v1/embeddings:
    post:
      summary: OpenAI-compatible embeddings
      operationId: openAiEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAiEmbeddingsRequest"
      responses:
        "200":
          description: Compatibility embeddings response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiEmbeddingsResponse"
  /api/tags:
    get:
      summary: Ollama-compatible model tags
      operationId: ollamaTags
      responses:
        "200":
          description: Compatibility tag list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaTagsResponse"
  /api/generate:
    post:
      summary: Ollama-compatible generation
      operationId: ollamaGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaGenerateRequest"
      responses:
        "200":
          description: Compatibility generate response or stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaGenerateResponse"
            application/x-ndjson:
              schema:
                type: string
  /sessions:
    get:
      summary: List active and persisted sessions
      operationId: listSessions
      responses:
        "200":
          description: Session inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Control-plane auth rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
    post:
      summary: Create a new persisted or in-memory session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreateResponse"
        "400":
          description: Invalid request or model reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Control-plane auth rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /sessions/{sessionId}:
    get:
      summary: Get one session summary and record history
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "401":
          description: Control-plane auth rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sessions/{sessionId}/generate:
    post:
      summary: Generate in the context of one session
      operationId: generateSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionGenerateRequest"
      responses:
        "200":
          description: Session generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGenerateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Control-plane auth rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sessions/{sessionId}/suspend:
    post:
      summary: Suspend one session with external wait metadata
      operationId: suspendSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSuspendRequest"
      responses:
        "200":
          description: Session mutation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMutationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Control-plane auth rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: Session not found
          content:
