components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ToolName:
      name: name
      in: path
      required: true
      schema:
        type: string
    PolicyName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ModelAssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ModelPullJobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    BackendInfo:
      type: object
      required: [name, version, has_gpu_support, supported_formats]
      properties:
        name:
          type: string
          example: llama.cpp
        version:
          type: string
          example: 0.0.0
        has_gpu_support:
          type: boolean
        supported_formats:
          type: array
          items:
            type: string
    EngineCapabilities:
      type: object
      required:
        [streaming, embeddings, multimodal, resource_planning, openai_compat, ollama_compat, plugin_hot_reload]
      properties:
        streaming:
          type: boolean
        embeddings:
          type: boolean
        multimodal:
          type: boolean
        resource_planning:
          type: boolean
        openai_compat:
          type: boolean
        ollama_compat:
          type: boolean
        plugin_hot_reload:
          type: boolean
    EnginePlugins:
      type: object
      required:
        [text_plugins_total, text_plugins_enabled, text_plugins_dynamic, text_plugins_wasm, tool_plugins_total]
      properties:
        text_plugins_total:
          type: integer
          format: int32
        text_plugins_enabled:
          type: integer
          format: int32
        text_plugins_dynamic:
          type: integer
          format: int32
        text_plugins_wasm:
          type: integer
          format: int32
        tool_plugins_total:
          type: integer
          format: int32
    EngineTools:
      type: object
      required: [registered_functions, tool_plugin_functions]
      properties:
        registered_functions:
          type: integer
          format: int32
        tool_plugin_functions:
          type: integer
          format: int32
    EngineIntegrations:
      type: object
      required: [rest, c_api, plugin_upgradeable, openapi_spec_path, openapi_spec_json_path]
      properties:
        rest:
          type: boolean
        c_api:
          type: boolean
        plugin_upgradeable:
          type: boolean
        openapi_spec_path:
          type: string
          example: /openapi.yaml
        openapi_spec_json_path:
          type: string
          example: /openapi.json
    InfoResponse:
      type: object
      required:
        [status, version, engine, positioning, runtime_model, backend, capabilities, plugins, tools, integrations, n_vocab, n_ctx_train, n_embd, n_layer, architecture]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "0.1.0"
        engine:
          type: string
          example: loci
        positioning:
          type: string
          example: embeddable-ai-inference-engine
        runtime_model:
          type: string
          example: loci/llama.cpp:llama
        backend:
          $ref: "#/components/schemas/BackendInfo"
        capabilities:
          $ref: "#/components/schemas/EngineCapabilities"
        plugins:
          $ref: "#/components/schemas/EnginePlugins"
        tools:
          $ref: "#/components/schemas/EngineTools"
        integrations:
          $ref: "#/components/schemas/EngineIntegrations"
        n_vocab:
          type: integer
          format: int32
          example: 151936
        n_ctx_train:
          type: integer
          format: int32
          example: 32768
        n_embd:
          type: integer
          format: int32
          example: 1024
        n_layer:
          type: integer
          format: int32
          example: 24
        param_count:
          type: integer
          format: int64
          nullable: true
        architecture:
          type: string
          example: llama
    MetricsResponse:
      type: object
      required:
        [status, started_at_unix_ms, uptime_ms, total_requests, total_client_errors, total_server_errors, average_latency_ms, endpoint_hits]
      properties:
        status:
          type: string
          example: ok
        started_at_unix_ms:
          type: integer
          format: int64
        uptime_ms:
          type: integer
          format: int64
        total_requests:
          type: integer
          format: int64
        total_client_errors:
          type: integer
          format: int64
        total_server_errors:
          type: integer
          format: int64
        average_latency_ms:
          type: number
          format: double
        endpoint_hits:
          type: object
          additionalProperties:
            type: integer
            format: int64
    RuntimeEventCategory:
      type: string
      enum: [http, auth, session, tool, model_asset, policy, plugin, runtime]
    RuntimeEventOutcome:
      type: string
      enum: [success, error, denied, started, cancelled]
    RuntimeEvent:
      type: object
      required: [sequence, at_unix_ms, category, action, outcome]
      properties:
        sequence:
          type: integer
          format: int64
        at_unix_ms:
          type: integer
          format: int64
        category:
          $ref: "#/components/schemas/RuntimeEventCategory"
        action:
          type: string
        outcome:
          $ref: "#/components/schemas/RuntimeEventOutcome"
        endpoint:
          type: string
          nullable: true
        method:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        status_code:
          type: integer
          format: int32
          nullable: true
        subject:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
    RuntimeEventListResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeEvent"
    ModelPlanRequest:
      type: object
      properties:
        model:
          type: string
          nullable: true
          example: D:/models/qwen.gguf
        model_id:
          type: string
          nullable: true
          example: qwen-local
        context_size:
          type: integer
          format: int32
          minimum: 1
          example: 8192
    StoredModel:
      type: object
      required:
        [id, name, path, source, size_bytes, checksum_xxh64, created_at_unix_ms, tags, managed]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        source:
          type: string
        size_bytes:
          type: integer
          format: int64
        checksum_xxh64:
          type: string
        checksum_sha256:
          type: string
          nullable: true
        created_at_unix_ms:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
        managed:
          type: boolean
    ModelAssetRegisterRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
    ModelAssetPullRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
        mirrors:
          type: array
          items:
            type: string
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        no_resume:
          type: boolean
          nullable: true
        stream:
          type: boolean
          nullable: true
        tags:
          type: array
          items:
            type: string
    ModelAssetListResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/StoredModel"
    ModelAssetRemoveResponse:
      type: object
      required: [model, deleted_file]
      properties:
        model:
