[package]
name = "loci"
version = "0.1.0"
edition = "2021"
authors = ["Creative Studio Team"]
description = "Local AI inference core for Creative Studio - Phase 1 Implementation"
license = "MIT"
repository = "https://github.com/your-org/loci"
readme = "README.md"

# 关键配置：支持多种库类型以适配不同平台
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# ==================== Phase 1: 直接集成依赖 ====================
[dependencies]
# 零拷贝文件加载
memmap2 = "0.9"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 高性能锁
parking_lot = "0.12"

# 系统信息检测
sysinfo = "0.32"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# UUID生成
uuid = { version = "1.19.0", features = ["v4"] }

# 字节序处理（GGUF解析）
byteorder = "1.5"

# 日志
log = "0.4"
env_logger = "0.11"

# CPU信息检测
num_cpus = "1.16"

# ==================== Phase 1: 构建依赖 ====================
[build-dependencies]
cmake = "0.1"
cc = "1.0"
bindgen = "0.70"  # FFI绑定生成

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"  # 性能基准测试

# ==================== 编译优化配置 ====================
[profile.release]
opt-level = 3          # 最高优化
lto = "fat"            # 链接时优化（更激进）
codegen-units = 1      # 单编译单元
strip = true           # 移除调试符号
panic = "abort"        # Panic直接中止

[profile.dev]
opt-level = 0
debug = true

# ==================== Phase 1: Feature Flags ====================
[features]
default = ["cpu"]

# 基础后端
cpu = []
avx2 = []
avx512 = []

# GPU加速
cuda = []
metal = []
rocm = []
vulkan = []

# OpenMP支持
openmp = []

# 开发特性
debug-logging = []

# ==================== Workspace配置 ====================
[[example]]
name = "loci-cli"
path = "examples/loci-cli/src/main.rs"

[workspace]
members = ["examples/loci-cli"]
