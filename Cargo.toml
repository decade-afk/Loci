[package]
name = "loci"
version = "0.1.0"
edition = "2021"
authors = ["Creative Studio Team"]
description = "Local AI inference core for Creative Studio - Phase 1 Implementation"
license = "MIT"
repository = "https://github.com/your-org/loci"
readme = "README.md"

# 关键配置：支持多种库类型以适配不同平台
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# ==================== Phase 1: 直接集成依赖 ====================
[dependencies]
# 零拷贝文件加载
memmap2 = "0.9"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 高性能锁
parking_lot = "0.12"

# 系统信息检测
sysinfo = "0.32"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"                # TOML 解析（插件清单）

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# UUID生成
uuid = { version = "1.19.0", features = ["v4"] }

# 字节序处理（GGUF解析）
byteorder = "1.5"

# 日志
log = "0.4"
env_logger = "0.11"

# CPU信息检测
num_cpus = "1.16"

# [Phase 1] 随机数生成（Sampling）
rand = "0.8"

# [Phase 2 Week 2] 正则表达式（Constraint Sampling）
regex = "1"

# [Phase 2 Week 5] 插件系统安全沙箱（双轨制：Native + WASM）
wasmtime = "26.0"           # WASM 运行时（2025 最成熟）
ed25519-dalek = "2.1"       # Ed25519 签名验证
sha2 = "0.10"               # SHA-256 哈希
libloading = "0.8"          # 动态库加载（Native 插件）
once_cell = "1.21"          # 全局单例

# [Phase 4 Week 1-2] 企业级安全与部署
aes-gcm = "0.10"            # AES-256-GCM 加密
zeroize = "1.8"             # 密钥自动擦除
hex = "0.4"                 # Hex 编解码

# ==================== Phase 3: 移动端平台支持 ====================
# Android平台依赖
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"                # Java Native Interface（Android互操作）
ndk = "0.9"                 # Android NDK绑定
ndk-context = "0.1"         # NDK上下文管理

# iOS平台依赖
[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"                # Objective-C运行时
block = "0.1"               # Objective-C block支持

# ==================== Phase 1: 构建依赖 ====================
[build-dependencies]
cmake = "0.1"
cc = "1.0"
cbindgen = "0.27"  # 生成 C 头文件（loci.h）

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }  # 性能基准测试

# ==================== 基准测试配置 ====================
[[bench]]
name = "performance_benchmarks"
harness = false  # 使用 Criterion 作为测试框架

[[bench]]
name = "benchmark_suite"
harness = false  # Loci 官方基准测试套件

# ==================== 编译优化配置 ====================
[profile.release]
opt-level = 3          # 最高优化
lto = "fat"            # 链接时优化（更激进）
codegen-units = 1      # 单编译单元
strip = true           # 移除调试符号
panic = "abort"        # Panic直接中止

[profile.dev]
opt-level = 0
debug = true

# ==================== Phase 1: Feature Flags ====================
[features]
default = ["cpu"]

# 基础后端
cpu = []
avx2 = []
avx512 = []

# GPU加速
cuda = []
metal = []
rocm = []
vulkan = []

# OpenMP支持
openmp = []

# 开发特性
debug-logging = []

# Phase 3: 移动端 FFI（用于测试和桌面平台导出）
mobile-ffi = []

# ==================== Workspace配置 ====================
[[example]]
name = "loci-cli"
path = "examples/loci-cli/src/main.rs"

[workspace]
members = ["examples/loci-cli"]
