[workspace]
members = [
    "crates/protocol",
    "crates/core",
    "crates/backend-openvino",
    "crates/backend-candle",
    "crates/tiered-offload",
    "crates/paged-kv",
    "crates/cli",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["o-dream"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
