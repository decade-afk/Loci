[package]
name = "loci"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/decade-afk/loci"
authors = ["decade-afk"]
description = "A cross-platform, plugin-based local LLM inference framework"
license = "MIT OR Apache-2.0"
exclude = [
    ".tmp_pip/**",
    ".pip_cache/**",
    "target/**",
    "examples/**/target/**",
]

[features]
# Default features: auto device detection
default = ["auto-detect", "wasm-plugins"]

# GPU backend features
cuda = []          # NVIDIA CUDA support
metal = []         # Apple Metal support (macOS/iOS)
vulkan = []        # Cross-platform Vulkan support
rocm = []          # AMD ROCm support
opencl = []        # OpenCL support (fallback GPU)

# Runtime device auto-detection
auto-detect = []
# Optional WASM plugin runtime (disabled for mobile builds)
wasm-plugins = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Optional remote session-store backend
redis-store = ["dep:redis"]

# Combined features
gpu = ["cuda", "metal", "vulkan", "rocm"]
all-backends = ["gpu", "opencl"]

# Plugin examples
plugin-examples = []

[lib]
name = "loci"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "loci"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# C bindings
libc = "0.2"
# Dynamic plugin loading
libloading = "0.8"
# Serialization for plugin config persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
# HTTP client for built-in model pull (local/remote source)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# SQLite-backed persistence for session snapshots
rusqlite = { version = "0.32", features = ["bundled"] }
redis = { version = "0.27", optional = true }
# High-performance synchronization primitives
parking_lot = "0.12"
# Concurrency utilities
crossbeam = "0.8"
# Memory-mapped file I/O for zero-copy model loading
memmap2 = "0.9"
# WASM runtime for plugin sandboxing (Phase 3)
wasmtime = { version = "27.0", optional = true, default-features = false, features = ["cranelift", "component-model"] }
wasmtime-wasi = { version = "27.0", optional = true }
# Fast hashing for KV cache block fingerprinting
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Cryptographic checksum for model integrity verification
sha2 = "0.10"
# CPU core count detection
num_cpus = "1.0"

[build-dependencies]
cmake = "0.1"
cc = "1.0"
bindgen = "0.72"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "inference"
harness = false
